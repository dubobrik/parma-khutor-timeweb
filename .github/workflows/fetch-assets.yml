name: Fetch site images

on:
  push:
    paths:
      - ".github/workflows/fetch-assets.yml"
      - "scripts/fetch_lovable_assets.py"
      - "src/assets/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and verify Lovable images
        run: python scripts/fetch_lovable_assets.py

      - name: Commit images to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/__l5e/assets-v1
          if git diff --cached --quiet; then
            echo "Images are already present."
          else
            git commit -m "Add Parma Khutor site images"
            git push
          fi
